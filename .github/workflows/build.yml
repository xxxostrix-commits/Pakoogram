name: Build Debug APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;21.4.7075529" "cmake;3.10.2.4988404"
      - name: Generate dummy signing key and API keys
        run: |
          chmod +x gradlew
          if [ ! -f TMessagesProj/config/release.keystore ]; then
            mkdir -p TMessagesProj/config
            keytool -genkey -v -keystore TMessagesProj/config/release.keystore -alias alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Pakoogram, OU=Dev, O=Pakoogram, L=City, S=State, C=US"
          fi
          echo "APP_ID=6" >> local.properties
          echo "APP_HASH=eb06d4abfb49dc3eeb1aeb98ae0f581e" >> local.properties
          echo "STORE_PASSWORD=password" >> local.properties
          echo "KEY_ALIAS=alias" >> local.properties
          echo "KEY_PASSWORD=password" >> local.properties
      - name: Build APK
        run: ./gradlew assembleFdroidDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pakoogram-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
