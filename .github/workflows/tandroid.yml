name: Fork Client

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  linux:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: nttld/setup-ndk@v1.4.2
        id: setup-ndk-r27c
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install NDK for the JNI build (ndkVersion).
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Prepare build config (test credentials, no GitHub secrets needed).
        run: |
          vars=gradle.properties

          # Public test API credentials: APP_ID 6 with the well-known test hash.
          # They are appended last so these values win over the committed defaults.
          echo "APP_ID=6" >> $vars
          echo "APP_HASH=eb06d4abfb49dc3eeb1aeb98ae0f581e" >> $vars
          echo "USER_ID_OWNER=123456789" >> $vars

          echo "DUMMY_CONST=0" >> $vars
          echo "org.gradle.workers.max=1" >> $vars
          echo "ADDITIONAL_BUILD_NUMBER=0" >> $vars
          echo "USER_REPO=$GITHUB_REPOSITORY" >> $vars
          echo "CHECK_UPDATES=1" >> $vars

          # The debug build is signed with the public TMessagesProj/config/test.keystore
          # shipped in the repository, so no RELEASE_KEYSTORE_FILE / passwords are required.
          cat $vars
      - name: Build debug APK.
        run: |
          chmod +x gradlew
          sudo apt update
          sudo apt -y install ninja-build meson nasm gperf pkg-config unzip pip
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup toolchain install 1.96.1 -t aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Collect debug APK.
        run: |
          set -e
          mkdir -p artifact

          apk=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "Debug APK was not produced!" >&2
            find TMessagesProj_App/build/outputs -maxdepth 4 >&2 || true
            exit 1
          fi

          version=$(find TMessagesProj_App/build/generated/source/buildConfig -name 'BuildConfig.java' -print -quit | xargs -r grep -m1 'VERSION_NAME' | cut -d'"' -f 2 || true)
          if [ -z "$version" ]; then
            version=$(grep -m1 '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f 2)
          fi

          echo "Detected version: $version"
          cp "$apk" "artifact/ForkClient-${version}-debug.apk"
          ls -la artifact

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ForkClient-debug-apk
          path: artifact/*.apk
          if-no-files-found: error

